name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.superpowers/**'
      - 'NOTICE'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 ndk;30.0.15729638 cmake;3.22.1
      - name: Install font tooling
        run: pip install --quiet fonttools brotli
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore FFmpeg arm64-v8a
        id: ffmpeg-cache-arm64
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-arm64-v8a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Restore FFmpeg armeabi-v7a
        id: ffmpeg-cache-armv7
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-armeabi-v7a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Restore FFmpeg x86_64
        id: ffmpeg-cache-x86
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-x86_64-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Build FFmpeg arm64-v8a
        if: steps.ffmpeg-cache-arm64.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh arm64-v8a
      - name: Build FFmpeg armeabi-v7a
        if: steps.ffmpeg-cache-armv7.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh armeabi-v7a
      - name: Build FFmpeg x86_64
        if: steps.ffmpeg-cache-x86.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh x86_64
      - name: Assemble prod release splits
        run: ./gradlew :androidApp:assembleProdRelease --no-daemon
      - name: Sign each ABI APK with shared beta key
        run: |
          set -x
          export KS_PASS=android KEY_PASS=android
          mkdir -p release-out
          ls -l androidApp/build/outputs/apk/prod/release
          for f in androidApp/build/outputs/apk/prod/release/*.apk; do
            n=$(basename "$f" .apk)-signed.apk
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks tools/keystore/tune-beta.keystore --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "release-out/$n" "$f"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "release-out/$n"
          done
          ls -l release-out
      - uses: actions/upload-artifact@v4
        with:
          name: tune-beta2-apks
          path: release-out/*.apk

