name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.superpowers/**'
      - 'NOTICE'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 ndk;30.0.15729638 cmake;3.22.1
      - name: Install font tooling
        run: pip install --quiet fonttools brotli
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore FFmpeg outputs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-arm64-v8a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Build FFmpeg arm64-v8a
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh arm64-v8a
      - name: Unit tests
        run: ./gradlew :sharedLogic:testAndroidHostTest --no-daemon
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDevDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tune-debug-apk
          path: androidApp/build/outputs/apk/dev/debug/*.apk
      - name: Branding gate
        run: |
          if grep -rniE 'airmedy|misa198' --exclude-dir=.git --exclude=NOTICE . ; then echo "STALE BRANDING"; exit 1; fi
