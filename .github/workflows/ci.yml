name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.superpowers/**'
      - 'NOTICE'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: tmp-grep-gate task-2 dead strings
        run: |
          ! grep -rn "sync_library_analysis|settings_sync|sync_title|sync_scan_title|sync_add_device|sync_empty_title|sync_empty_description|sync_device_type_desktop|sync_status_connected|sync_status_online|sync_status_offline|sync_last_synced|sync_never_synced|sync_paired_device_description|sync_ready_to_connect_description|sync_revoke|sync_help|sync_waiting_title|sync_waiting_description|sync_camera_required|sync_scan_description|sync_scan_hint|sync_select_qr_image|sync_revoke_confirm_title|sync_revoke_confirm_description|sync_error_already_paired|sync_error_invalid_qr|sync_error_transport|sync_error_timeout|sync_error_rejected|sync_error_expired|sync_error_invalid_response|sync_notification_channel|sync_notification_title|sync_notification_connecting|sync_notification_progress|sync_notification_complete|sync_notification_failed|sync_insufficient_storage_title|sync_insufficient_storage_description|sync_error_background_timeout|sync_progress_connecting|sync_progress_syncing" androidApp/src/main androidApp/src/test sharedLogic/src --include="*.kt" --include="*.xml"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 ndk;30.0.15729638 cmake;3.22.1
      - name: Install font tooling
        run: pip install --quiet fonttools brotli
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore FFmpeg outputs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-arm64-v8a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Build FFmpeg arm64-v8a
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh arm64-v8a
      - name: Unit tests
        run: ./gradlew :sharedLogic:testAndroidHostTest --no-daemon
      - name: Android unit tests
        run: ./gradlew :androidApp:testDevDebugUnitTest --no-daemon
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDevDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tune-debug-apk
          path: androidApp/build/outputs/apk/dev/debug/*.apk
      - name: Branding gate
        run: |
          if grep -rniE 'airmedy|misa198' --exclude-dir=.git --exclude-dir=.github --exclude-dir=.superpowers --exclude-dir=docs --exclude-dir=build --exclude-dir=.gradle --exclude=NOTICE . ; then echo "STALE BRANDING"; exit 1; fi
      - name: Snapshot debug APK
        if: success()
        run: |
          set -x
          mkdir -p build-artifacts
          cp androidApp/build/outputs/apk/dev/debug/*.apk build-artifacts/tune-debug.apk
          git config user.email "tune-ci@users.noreply.github.com"
          git config user.name "tune-ci"
          git add -f build-artifacts/tune-debug.apk
          if git diff --cached --quiet; then echo "no new apk"; exit 0; fi
          git commit -m "chore(apk): snapshot debug build [ci]"
          git push --force origin HEAD:refs/heads/apk-latest