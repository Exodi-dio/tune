name: ci
on: {push: {branches: [main], paths-ignore: ['docs/**', '.superpowers/**', NOTICE, README.md, AGENTS.md]}, pull_request: null, workflow_dispatch: null}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-36 ndk;30.0.15729638 cmake;3.22.1'}
      - name: Install font tooling
        run: pip install --quiet fonttools brotli
      - uses: gradle/actions/setup-gradle@v4
      - name: FFmpeg
        run: for a in arm64-v8a armeabi-v7a x86_64; do bash scripts/build-ffmpeg-android.sh $a; done
      - name: Assemble prod release splits
        run: ./gradlew :androidApp:assembleProdRelease --no-daemon
      - name: Sign each ABI APK with shared beta key
        run: |
          export KS_PASS=android KEY_PASS=android
          mkdir -p release-out
          for f in androidApp/build/outputs/apk/prod/release/*.apk; do
            n=$(basename "$f" .apk)-signed.apk
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks tools/keystore/tune-beta.keystore --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "release-out/$n" "$f"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "release-out/$n"
          done
      - uses: actions/upload-artifact@v4
        with: {name: tune-beta2-apks, path: release-out/*.apk}

