name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.superpowers/**'
      - 'NOTICE'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build AMLL runtime assets
        run: scripts/build-amll-assets.sh "$GITHUB_WORKSPACE/androidApp/build/generated/amllAssets/amll"
      - name: Verify AMLL source pins
        run: node tools/amll/verify-amll-assets.mjs
        env:
          AMLL_SOURCE_REVISION: 86200dead453bb067e554e989110cbadca8d4756
          TTML_TOOL_SOURCE_REVISION: d4953b351ae073c1447464790fff17aa9bc1d807
      - name: Test AMLL parser bridge
        run: node tools/amll/test-parse.mjs
      - name: Install search tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Reject stale fullscreen behavior
        run: |
          ! rg -n 'fullscreenArtwork|fullscreenLyrics|SetFullscreenArtwork|SetFullscreenLyrics' \
            androidApp/src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 ndk;30.0.15729638 cmake;3.22.1
      - name: Install font tooling
        run: pip install --quiet fonttools brotli
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore FFmpeg outputs arm64-v8a
        id: ffmpeg-cache-arm64-v8a
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-arm64-v8a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Restore FFmpeg outputs armeabi-v7a
        id: ffmpeg-cache-armeabi-v7a
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-armeabi-v7a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Restore FFmpeg outputs x86_64
        id: ffmpeg-cache-x86_64
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-x86_64-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Build FFmpeg arm64-v8a
        if: steps.ffmpeg-cache-arm64-v8a.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh arm64-v8a
      - name: Build FFmpeg armeabi-v7a
        if: steps.ffmpeg-cache-armeabi-v7a.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh armeabi-v7a
      - name: Build FFmpeg x86_64
        if: steps.ffmpeg-cache-x86_64.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh x86_64
      - name: Unit tests
        run: ./gradlew :sharedLogic:testAndroidHostTest --no-daemon
      - name: Android unit tests
        run: ./gradlew :androidApp:testDevDebugUnitTest --no-daemon
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDevDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tune-debug-apk
          path: androidApp/build/outputs/apk/dev/debug/*.apk
      - name: Branding gate
        run: |
          if grep -rniE 'airmedy|misa198' --exclude-dir=.git --exclude-dir=.github --exclude-dir=.superpowers --exclude-dir=docs --exclude-dir=build --exclude-dir=.gradle --exclude=NOTICE --exclude=README.md . ; then echo "STALE BRANDING"; exit 1; fi
      - name: Snapshot debug APK
        if: success()
        run: |
          set -x
          mkdir -p build-artifacts
          cp androidApp/build/outputs/apk/dev/debug/*.apk build-artifacts/tune-debug.apk
          git config user.email "tune-ci@users.noreply.github.com"
          git config user.name "tune-ci"
          git add -f build-artifacts/tune-debug.apk
          if git diff --cached --quiet; then echo "no new apk"; exit 0; fi
          git commit -m "chore(apk): snapshot debug build [ci]"
          git push --force origin HEAD:refs/heads/apk-latest
