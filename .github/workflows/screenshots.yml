name: screenshots
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to screenshot'
        required: false
        default: 'beta/adaptive-theme'
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 platforms;android-34 system-images;android-34;google_apis;x86_64 ndk;30.0.15729638 cmake;3.22.1
      - name: Install font tooling
        run: pip install --quiet fonttools brotli
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore FFmpeg outputs arm64-v8a
        id: ffmpeg-cache-arm64-v8a
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-arm64-v8a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Restore FFmpeg outputs armeabi-v7a
        id: ffmpeg-cache-armeabi-v7a
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-armeabi-v7a-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Restore FFmpeg outputs x86_64
        id: ffmpeg-cache-x86_64
        uses: actions/cache@v4
        with:
          path: |
            androidApp/src/main/jniLibs
            androidApp/build/ffmpeg
          key: ffmpeg-x86_64-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Build FFmpeg arm64-v8a
        if: steps.ffmpeg-cache-arm64-v8a.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh arm64-v8a
      - name: Build FFmpeg armeabi-v7a
        if: steps.ffmpeg-cache-armeabi-v7a.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh armeabi-v7a
      - name: Build FFmpeg x86_64
        if: steps.ffmpeg-cache-x86_64.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh x86_64
      - name: Pre-start adb daemon
        run: |
          adb kill-server || true
          adb start-server
          adb devices
      - name: Capture adaptive screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim -no-window -gpu swiftshader_indirect
          script: |
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            ./gradlew :androidApp:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.exodidio.tune.ui.navigation.AdaptiveScreenshotsTest --no-daemon
            mkdir -p shots
            adb pull /sdcard/Android/data/com.exodidio.tune.dev/files/shots shots || true
            ls -la shots || true
            find . -name "01-appearance-adaptive.png" -o -name "*.png" | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: tune-screenshots
          path: shots/
          if-no-files-found: error
