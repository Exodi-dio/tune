name: prune-sync
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete sync transport, pairing, sync UI shell and their tests
        run: |
          set -eux
          R=androidApp/src/main/kotlin/com/exodidio/tune
          T=androidApp/src/test/kotlin/com/exodidio/tune
          A=androidApp/src/androidTest/kotlin/com/exodidio/tune
          rm_exist() { if [ -e "$1" ]; then git rm -r --quiet "$1"; else echo "already gone: $1"; fi }
          rm_exist $R/pairing
          rm_exist $R/sync/AndroidLibrarySyncPuller.kt
          rm_exist $R/sync/LibrarySyncService.kt
          rm_exist $R/sync/AndroidPlaylistReconciliation.kt
          rm_exist $R/sync/PlaylistArtworkStorage.kt
          rm_exist $R/SyncViewModel.kt
          rm_exist $R/ui/screens/SyncContent.kt
          rm_exist $R/ui/screens/SyncScannerContent.kt
          rm_exist $T/SyncViewModelTest.kt
          rm_exist $T/ui/screens/SyncScannerContentTest.kt
          rm_exist $A/ui/screens/SyncContentTest.kt
      - name: Write pruned sync runtime seam
        run: |
          set -eux
          cat > androidApp/src/main/kotlin/com/exodidio/tune/sync/SyncRuntime.kt <<'KT'
          package com.exodidio.tune.sync

          import android.content.Context
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.flowOf

          sealed interface AndroidSyncState {
              data object Idle : AndroidSyncState
              data class Running(val planId: String? = null, val completed: Int = 0, val total: Int = 0) : AndroidSyncState
              data class Failed(val message: String, val requiredBytes: Long? = null, val availableBytes: Long? = null) : AndroidSyncState
              data class Completed(val planId: String) : AndroidSyncState
          }

          internal object AndroidSyncRuntime {
              private lateinit var store: AndroidLibrarySyncStore
              private lateinit var appContext: Context
              private val _state = MutableStateFlow<AndroidSyncState>(AndroidSyncState.Idle)
              val state: StateFlow<AndroidSyncState> = _state

              fun initialize(context: Context) {
                  if (::appContext.isInitialized) return
                  appContext = context.applicationContext
                  store = AndroidLibrarySyncStore(SyncDatabase.create(appContext), appContext.filesDir)
              }

              fun running(planId: String? = null, completed: Int = 0, total: Int = 0) { _state.value = AndroidSyncState.Running(planId, completed, total) }
              fun failed(message: String, requiredBytes: Long? = null, availableBytes: Long? = null) {
                  _state.value = AndroidSyncState.Failed(message, requiredBytes, availableBytes)
              }
              fun completed(planId: String) { _state.value = AndroidSyncState.Completed(planId) }
              fun idle() { _state.value = AndroidSyncState.Idle }
              suspend fun awaitNoForegroundSync() { state.first { it !is AndroidSyncState.Running } }
              fun tracks(): Flow<List<LibraryTrack>> = if (::appContext.isInitialized) store.tracks else flowOf(emptyList())
              internal fun syncStore(): AndroidLibrarySyncStore = store
          }
          KT
          git add androidApp/src/main/kotlin/com/exodidio/tune/sync/SyncRuntime.kt
      - name: Rewire call sites
        run: |
          set -eux
          python3 scripts/prune_transform.py
      - name: Prune unused sync-only dependencies
        run: |
          set -eux
          for key in hivemq eddsa mlkit barcode camerax; do
            echo "=== usages of $key:"
            grep -rin "$key" --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle androidApp sharedLogic gradle || echo "NONE"
          done
      - name: Commit and push
        run: |
          git config user.name "tune-bot"
          git config user.email "tune-bot@users.noreply.github.com"
          git add -A
          git commit -m "Remove PC sync transport, pairing and sync UI (local cutover part 1)" || echo "nothing to commit"
          git push origin HEAD:main
