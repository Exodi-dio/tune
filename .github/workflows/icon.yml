name: icon
on:
  push:
    paths:
      - brand/icon-source.png
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate icon set
        run: |
          pip install --quiet pillow numpy
          python3 scripts/make-icons.py
      - name: Commit icon set
        run: |
          git config user.name "tune-bot"
          git config user.email "tune-bot@users.noreply.github.com"
          git add androidApp/src/main/res brand
          git commit -m "icons: regenerate from brand source" || echo "no icon changes"
          git push origin HEAD:main
