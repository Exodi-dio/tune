name: emulator-smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools platforms;android-34 system-images;android-34;google_apis;x86_64 }
      - name: Install font tooling
        run: pip install --quiet fonttools brotli
      - uses: gradle/actions/setup-gradle@v4
      - name: Pre-start adb daemon
        run: |
          adb kill-server || true
          adb start-server
          adb devices
      - name: Run instrumented tests on 2GB AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-snapshot -no-audio -no-boot-anim -no-window -gpu swiftshader_indirect
          script: ./gradlew :androidApp:connectedDevDebugAndroidTest --no-daemon

