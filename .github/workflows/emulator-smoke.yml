name: emulator-smoke
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools platforms;android-34 system-images;android-34;google_apis;x86_64 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on 2GB AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          avd-config: |
            hw.ramSize=2048
            vm.heapSize=256
          script: ./gradlew :androidApp:connectedDevDebugAndroidTest --no-daemon

